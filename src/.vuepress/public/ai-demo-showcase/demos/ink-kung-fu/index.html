<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水墨功夫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
:root{
  color-scheme: dark;
  --theater:#0d0c0a; --theater-2:#17140f;
  --paper:#ece3cf; --paper-2:#d9ceb6;
  --ink:#16130f; --ink-soft:#4a4238;
  --cinnabar:#b23a22; --cinnabar-2:#c9482d;
  --chrome:rgba(236,227,207,.88); --chrome-dim:rgba(236,227,207,.55);
  --f-brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC","楷体",serif;
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --f-latin:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
}
html,body{height:100%}
body{margin:0;background:var(--theater);color:var(--paper);font-family:var(--f-serif);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;display:grid;place-items:center;padding-inline:16px;box-sizing:border-box;
  background:radial-gradient(120% 90% at 50% 42%,var(--theater-2),var(--theater) 72%)}
#app.is-full{padding-inline:0;background:#000}
#stage{position:relative;width:960px;height:540px;max-width:100%;background:var(--paper);overflow:hidden;
  container-type:size;user-select:none;-webkit-user-select:none;
  box-shadow:0 34px 90px rgba(0,0,0,.6),0 0 0 1px rgba(236,227,207,.06)}
#app.is-full #stage{box-shadow:none}
#stage.is-idle{cursor:none}
#film{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- 封面 ---------- */
.cover{position:absolute;inset:0;color:var(--ink);transition:opacity .9s ease,visibility .9s}
.cover.is-gone{opacity:0;visibility:hidden}
.cover-title{position:absolute;left:53cqw;top:13cqh;margin:0;font:400 20cqh/1.02 var(--f-brush);
  writing-mode:vertical-rl;letter-spacing:.04em;color:var(--ink);text-shadow:0 0 .05em rgba(22,19,15,.4)}
.cover-kicker{position:absolute;left:66.2cqw;top:14cqh;margin:0;writing-mode:vertical-rl;
  font:500 2cqh/1 var(--f-latin);letter-spacing:.42em;text-transform:uppercase;color:var(--ink-soft)}
.cover-line{position:absolute;left:47.4cqw;top:20cqh;margin:0;writing-mode:vertical-rl;
  font:400 2.5cqh/1 var(--f-serif);letter-spacing:.85em;color:var(--ink-soft)}
.cover-actions{position:absolute;left:38.5cqw;top:57cqh;display:flex;flex-direction:column;align-items:flex-start;gap:2cqh}
.seal{--s:11cqh;width:var(--s);height:var(--s);border:0;padding:0;border-radius:.5cqh;background:var(--cinnabar);
  color:var(--paper);font:400 calc(var(--s)*.36)/1.02 var(--f-brush);writing-mode:vertical-rl;letter-spacing:.02em;
  display:grid;place-items:center;cursor:pointer;
  transition:transform .3s cubic-bezier(.16,1,.3,1),background-color .2s,opacity .3s}
.seal:hover:not(:disabled){transform:rotate(-4deg) scale(1.05);background:var(--cinnabar-2)}
.seal:disabled{cursor:progress;opacity:.62;animation:grind 1.6s ease-in-out infinite}
@keyframes grind{50%{opacity:.4}}
.text-btn{background:none;border:0;padding:.3em 0;color:var(--ink);cursor:pointer;
  font:400 max(12px,2cqh)/1.3 var(--f-serif);letter-spacing:.1em;
  text-decoration:underline;text-underline-offset:.35em;text-decoration-color:rgba(22,19,15,.35)}
.cover-note{position:absolute;left:0;right:0;bottom:6.5cqh;margin:0;text-align:center;
  font:400 max(11px,1.75cqh)/1.4 var(--f-serif);letter-spacing:.16em;color:var(--ink-soft)}
.seal:focus-visible,.text-btn:focus-visible,.ctl:focus-visible,.timeline:focus-visible,.replay:focus-visible{
  outline:2px solid var(--cinnabar-2);outline-offset:3px}

/* ---------- 播放控制 ---------- */
.controls{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;
  padding:34px 16px 12px;background:linear-gradient(to top,rgba(10,9,7,.78),rgba(10,9,7,0));
  color:var(--chrome);font:400 13px/1 var(--f-serif);transition:opacity .35s ease,transform .35s ease}
.controls.is-hidden{opacity:0;transform:translateY(8px);pointer-events:none}
.ctl{flex:none;width:36px;height:36px;display:grid;place-items:center;border:0;padding:0;border-radius:50%;
  background:none;color:inherit;cursor:pointer}
.ctl:hover{background:rgba(236,227,207,.12)}
.ctl svg{width:20px;height:20px;fill:currentColor}
.timeline{position:relative;flex:1;min-width:60px;height:26px;cursor:pointer;touch-action:none}
.track{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:rgba(236,227,207,.22);border-radius:2px;overflow:hidden}
.fill{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);background:var(--cinnabar-2)}
.tick{position:absolute;top:50%;width:2px;height:9px;margin:-4.5px 0 0 -1px;background:rgba(236,227,207,.6);pointer-events:none}
.knob{position:absolute;top:50%;left:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--paper);
  box-shadow:0 0 0 3px rgba(201,72,45,.5);transform:scale(0);transition:transform .15s;pointer-events:none}
.timeline:hover .knob,.timeline:focus-visible .knob,.timeline.is-drag .knob{transform:scale(1)}
.tip{position:absolute;bottom:28px;left:0;transform:translateX(-50%);padding:6px 9px;border-radius:3px;
  background:rgba(14,12,10,.92);color:var(--paper);font:400 12px/1 var(--f-serif);letter-spacing:.08em;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .15s}
.timeline:hover .tip,.timeline.is-drag .tip{opacity:1}
.time{flex:none;font-variant-numeric:tabular-nums;letter-spacing:.05em;color:var(--chrome-dim);min-width:96px;text-align:right}
@container (max-width:560px){ .time{display:none} .controls{gap:6px;padding:26px 8px 6px} }

/* ---------- 片尾 ---------- */
.replay{position:absolute;right:5cqw;bottom:11cqh;display:flex;align-items:center;gap:.6em;border:0;border-radius:99px;
  padding:.7em 1.3em;background:rgba(22,19,15,.86);color:var(--paper);cursor:pointer;
  font:400 max(12px,2cqh)/1 var(--f-serif);letter-spacing:.14em;opacity:0;visibility:hidden;transition:opacity .8s ease .3s,background-color .2s}
.replay.is-on{opacity:1;visibility:visible}
.replay:hover{background:var(--cinnabar)}
.replay svg{width:1.2em;height:1.2em}
.rotate-hint{position:absolute;left:50%;top:4cqh;transform:translateX(-50%);margin:0;padding:.35em .9em;border-radius:99px;
  background:rgba(22,19,15,.75);color:var(--paper);font:400 11px/1.4 var(--f-serif);letter-spacing:.1em;white-space:nowrap}

/* ---------- 分镜检查（#storyboard） ---------- */
.sb{position:fixed;inset:0;z-index:9;overflow:auto;background:#111;display:grid;gap:10px;padding:16px;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-content:start}
.sb figure{margin:0}.sb canvas{width:100%;display:block;background:#222}
.sb figcaption{font:12px/1.6 ui-monospace,monospace;color:#bbb}
@media (prefers-reduced-motion:reduce){ .cover,.controls,.seal,.replay{transition:none} .seal:disabled{animation:none} }
</style>

</head>
<body>
<div id="app">
  <div id="stage" aria-label="水墨功夫宣传片">
    <canvas id="film" aria-hidden="true"></canvas>

    <div id="cover" class="cover">
      <h1 class="cover-title">功夫</h1>
      <p class="cover-kicker">Ink · Kung Fu</p>
      <p class="cover-line">身为笔 · 气为墨 · 天地为纸</p>
      <div class="cover-actions">
        <button id="btnStart" class="seal" type="button" disabled aria-label="开始播放">研墨</button>
        <button id="btnResume" class="text-btn" type="button" hidden>继续观看</button>
      </div>
      <p class="cover-note">水墨功夫宣传片 · 约 64 秒 · 建议开启声音</p>
      <p id="rotateHint" class="rotate-hint" hidden>横屏观看效果更佳</p>
    </div>

    <button id="btnReplay" class="replay" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.6 4.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4.6 4.4v5.2h5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      再看一遍
    </button>

    <div id="controls" class="controls is-hidden" hidden>
      <button id="btnPlay" class="ctl" type="button" aria-label="播放">
        <svg id="icPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <svg id="icPause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>
      </button>
      <div id="timeline" class="timeline" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="64" aria-valuenow="0">
        <div class="track"><div id="fill" class="fill"></div></div>
        <div id="ticks"></div>
        <div id="knob" class="knob"></div>
        <div id="tip" class="tip">00:00</div>
      </div>
      <span id="time" class="time">00:00 / 01:04</span>
      <button id="btnMute" class="ctl" type="button" aria-label="静音">
        <svg id="icVol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.6L12 5.6v12.8l-4.4-3.9H4z"/><path d="M15.4 8.6a4.8 4.8 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg id="icMute" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M4 9.5h3.6L12 5.6v12.8l-4.4-3.9H4z"/><path d="M15.6 9.6l4.8 4.8m0-4.8l-4.8 4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="btnFull" class="ctl" type="button" aria-label="全屏">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
'use strict';
/* =============================================================
   水墨功夫 · 一部由代码绘制的水墨短片
   画面：Canvas 2D 实时绘制（宣纸、山水、竹林、人物、笔触、印章）
   声音：Web Audio 实时合成（古琴、箫、战鼓、锣、风声、刀剑声）
   「功夫」笔顺数据：Make Me a Hanzi / hanzi-writer-data（Arphic Public License）
   ============================================================= */
const W = 1920, H = 1080, DURATION = 64, TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const smooth = t => t * t * (3 - 2 * t);
const E = {
  lin: t => t,
  inQ: t => t * t,
  outQ: t => 1 - (1 - t) * (1 - t),
  ioQ: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  inC: t => t * t * t,
  outC: t => 1 - Math.pow(1 - t, 3),
  ioC: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outE: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inE: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  ioS: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outB: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
const seg = (t, a, b, e) => (e || E.lin)(inv(a, b, t));
// 时间窗包络：a 起、b 止，fi 淡入、fo 淡出
function env(t, a, b, fi, fo) {
  if (t < a || t > b) return 0;
  const i = fi > 0 ? smooth(inv(a, a + fi, t)) : 1;
  const o = fo > 0 ? 1 - smooth(inv(b - fo, b, t)) : 1;
  return Math.min(i, o);
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(n) {
  n = n | 0;
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = n ^ (n >>> 16);
  return (n >>> 0) / 4294967296;
}
const rnd = (s, i) => hash(Math.imul(s | 0, 7919) + Math.imul(i | 0, 104729) + 13);

const Noise = (() => {
  const P = new Uint8Array(512), G = new Float32Array(256), r = mulberry32(20260924);
  for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const tmp = P[i]; P[i] = P[j]; P[j] = tmp; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  const f = t => t * t * t * (t * (t * 6 - 15) + 10);
  function n2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
    const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
    const u = f(xf), v = f(yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o) {
    o = o || 4; let s = 0, amp = 0.5, n = 0;
    for (let i = 0; i < o; i++) { s += amp * n2(x, y); n += amp; x = x * 2.03 + 17.1; y = y * 2.03 + 3.7; amp *= 0.5; }
    return s / n;
  }
  return { n2, fbm, n1: x => n2(x, 7.31) };
})();

/* ---------- 色彩 ---------- */
const INK = [22, 19, 15], INK2 = [52, 47, 41], GREY = [104, 96, 86], MIST = [150, 142, 130];
const PAPER = [236, 227, 207], PAPERL = [247, 242, 230], CINNABAR = [178, 58, 34];
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a <= 0 ? 0 : a >= 1 ? 1 : Math.round(a * 1000) / 1000) + ')';
const mixc = (c1, c2, t) => [Math.round(lerp(c1[0], c2[0], t)), Math.round(lerp(c1[1], c2[1], t)), Math.round(lerp(c1[2], c2[2], t))];

const F_BRUSH = '"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif';
const F_SERIF = '"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif';
const F_LATIN = '"Cormorant Garamond","Iowan Old Style",Georgia,serif';

/* ---------- 画布与缩放 ---------- */
const cvs = document.getElementById('film');
const ctx = cvs.getContext('2d', { alpha: false });
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = window.matchMedia && matchMedia('(pointer: coarse)').matches;
function chooseK() {
  const dpr = window.devicePixelRatio || 1;
  const px = Math.max(screen.width || 1280, screen.height || 720) * dpr;
  return Math.round(clamp(px / W, 0.5, COARSE ? 0.75 : 1.25) * 100) / 100;
}
const K = chooseK();          // 素材分辨率（设计单位 → 像素）
let RS = K;                   // 主画布分辨率（可随性能自适应下调）
function setRenderScale(s) { RS = s; cvs.width = Math.round(W * s); cvs.height = Math.round(H * s); }
setRenderScale(K);

function mk(w, h, s) {
  s = s || K;
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * s)); c.height = Math.max(1, Math.ceil(h * s));
  const g = c.getContext('2d');
  g.setTransform(s, 0, 0, s, 0, 0);
  c._s = s; c._w = w; c._h = h;
  return { c, g };
}
function blit(g, c, x, y, a, sc) {
  if (a != null && a <= 0.003) return;
  const s = sc || 1;
  if (a != null) g.globalAlpha = a;
  g.drawImage(c, x, y, c._w * s, c._h * s);
  if (a != null) g.globalAlpha = 1;
}
function screenSpace(g) { g.setTransform(RS, 0, 0, RS, 0, 0); }
// 摄像机：c = {x, y, z, sx, sy}；depth 越小越远（视差）
function applyCam(g, c, depth) {
  const d = depth == null ? 1 : depth;
  const z = 1 + (c.z - 1) * d, cx = 960 + (c.x - 960) * d, cy = 540 + (c.y - 540) * d;
  g.setTransform(RS * z, 0, 0, RS * z, RS * (960 - cx * z + (c.sx || 0) * d), RS * (540 - cy * z + (c.sy || 0) * d));
}
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
const yieldUI = () => new Promise(r => setTimeout(r, 0));

/* ---------- 毛笔笔触：pts = [[x, y, 宽], ...] ---------- */
function brush(g, pts, o) {
  o = o || {};
  const n = pts.length; if (n < 2) return;
  const col = o.c || INK, a = o.a == null ? 1 : o.a;
  if (a <= 0.003) return;
  const seed = o.seed || 1;
  const nx = new Float32Array(n), ny = new Float32Array(n);
  let wsum = 0;
  for (let i = 0; i < n; i++) {
    const p0 = pts[i > 0 ? i - 1 : 0], p1 = pts[i < n - 1 ? i + 1 : n - 1];
    const dx = p1[0] - p0[0], dy = p1[1] - p0[1], l = Math.hypot(dx, dy) || 1;
    nx[i] = -dy / l; ny[i] = dx / l; wsum += pts[i][2];
  }
  const aw = wsum / n;
  const outline = s => {
    g.beginPath();
    for (let i = 0; i < n; i++) {
      const p = pts[i], h = p[2] * 0.5 * s;
      if (i) g.lineTo(p[0] + nx[i] * h, p[1] + ny[i] * h); else g.moveTo(p[0] + nx[i] * h, p[1] + ny[i] * h);
    }
    for (let i = n - 1; i >= 0; i--) { const p = pts[i], h = p[2] * 0.5 * s; g.lineTo(p[0] - nx[i] * h, p[1] - ny[i] * h); }
    g.closePath();
  };
  if (o.halo) { g.fillStyle = rgba(col, a * o.halo); outline(1.5); g.fill(); }
  g.fillStyle = rgba(col, a);
  outline(1); g.fill();
  if (o.cap !== false) {
    const p0 = pts[0], p1 = pts[n - 1];
    if (p0[2] > 2) { g.beginPath(); g.arc(p0[0], p0[1], p0[2] * 0.5, 0, TAU); g.fill(); }
    if (p1[2] > 2) { g.beginPath(); g.arc(p1[0], p1[1], p1[2] * 0.5, 0, TAU); g.fill(); }
  }
  const bs = o.bristle == null ? 4 : o.bristle;
  if (bs > 0 && aw > 2.5) {
    const dry = o.dry || 0;
    g.lineCap = 'round';
    for (let b = 0; b < bs; b++) {
      const off = (rnd(seed, b) - 0.5) * 0.84;
      const light = rnd(seed, b + 97) < 0.72;
      const st = Math.floor(rnd(seed, b + 51) * (1 - dry * 0.6) * 0.6 * (n - 1));
      g.strokeStyle = light ? rgba(PAPER, (0.07 + 0.32 * dry) * a) : rgba(INK, 0.3 * a);
      g.lineWidth = Math.max(0.5, aw * (0.035 + 0.08 * dry) * (0.6 + rnd(seed, b + 7)));
      if (dry > 0.25) g.setLineDash([6 + rnd(seed, b + 3) * 34, 2 + rnd(seed, b + 5) * 12 * dry]);
      g.beginPath();
      for (let i = st; i < n; i++) {
        const p = pts[i], x = p[0] + nx[i] * p[2] * off, y = p[1] + ny[i] * p[2] * off;
        if (i === st) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke();
      if (dry > 0.25) g.setLineDash([]);
    }
  }
}

/* ---------- 墨点、晕染（逐像素生成） ---------- */
function makeBlot(seed, S, soft) {
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S), d = img.data;
  const cx = S / 2, cy = S / 2, r0 = S * (soft ? 0.3 : 0.33), ph = seed * 17.3;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = x - cx, dy = y - cy, r = Math.hypot(dx, dy), th = Math.atan2(dy, dx);
    const cs = Math.cos(th), sn = Math.sin(th);

    const b0 = [h0[0] + ux * 5 * S, h0[1] + uy * 5 * S];
    brush(g, [[b0[0], b0[1], 4.4 * S], [lerp(b0[0], t0[0], 0.6), lerp(b0[1], t0[1], 0.6), 3.5 * S], [t0[0], t0[1], 0.5 * S]], { c: [50, 48, 46], a: al, bristle: 0, cap: false });
    g.strokeStyle = rgba(PAPERL, 0.6 * al); g.lineWidth = Math.max(0.6, 0.9 * S); g.lineCap = 'round';
    g.beginPath(); g.moveTo(b0[0] + uy * 0.6 * S, b0[1] - ux * 0.6 * S); g.lineTo(lerp(b0[0], t0[0], 0.9), lerp(b0[1], t0[1], 0.9)); g.stroke();
    if (o._hist) {
      const aPom = f => { const ddx = f.SW[0] - f.HF[0], ddy = f.SW[1] - f.HF[1], ll = Math.hypot(ddx, ddy) || 1; return [f.HF[0] - ddx / ll * 17 * f.sc, f.HF[1] - ddy / ll * 17 * f.sc]; };

}

/* ---------- 招式墨痕 ---------- */
// sp: {j: 关节, t0, t1, w, fade, dry, a, seed, c}
function trail(g, tr, st, sp) {
  if (st < sp.t0) return;
  const age = st - sp.t1;
  const fa = age > 0 ? 1 - smooth(clamp(age / (sp.fade || 0.9), 0, 1)) : 1;
  if (fa <= 0.01) return;
  const tEnd = Math.min(st, sp.t1), N = sp.n || 22, q = clamp(age / 0.15, 0, 1), pts = [];
  if (tEnd - sp.t0 < 0.004) return;
  for (let i = 0; i <= N; i++) {
    const s = i / N, p = figAt(tr, lerp(sp.t0, tEnd, s))[sp.j];
    // 书写中：笔头渐粗、锋尖收；写完：起笔重、收笔出锋
    const wD = (0.12 + 0.88 * Math.pow(s, 0.7)) * (s > 0.86 ? 1 - (s - 0.86) / 0.14 * 0.65 : 1);
    const wF = Math.pow(Math.sin(Math.PI * clamp(s, 0.03, 0.97)), 0.6) * (1.18 - 0.55 * s);
    pts.push([p[0], p[1], sp.w * lerp(wD, wF, q) * (1 + (age > 0 ? age * 0.25 : 0))]);
  }
  brush(g, pts, { c: sp.c || INK, a: (sp.a || 0.9) * fa, dry: sp.dry == null ? 0.6 : sp.dry, bristle: 10, halo: 0.08, seed: sp.seed || 7, cap: false });
}
// 旋身墨环：围绕人物的椭圆笔势（旋风腿、转身剑）
function whirl(g, tr, st, sp) {
  if (st < sp.t0) return;
  const age = st - sp.t1, fa = age > 0 ? 1 - smooth(clamp(age / (sp.fade || 0.9), 0, 1)) : 1;
  if (fa <= 0.01) return;
  const f = figAt(tr, clamp(st, sp.t0, sp.t1)), cx = f.P[0] + (sp.dx || 0), cy = f.P[1] + (sp.dy || 0);
  const u = inv(sp.t0, sp.t1, st), span = sp.turns * TAU * E.outQ(u), tail = Math.max(0, span - TAU * 0.85);
  if (span - tail < 0.05) return;
  const N = 44, pts = [];
  for (let i = 0; i <= N; i++) {
    const s = i / N, a = -Math.PI / 2 + sp.dir * lerp(tail, span, s);
    const w = sp.w * Math.pow(Math.sin(Math.PI * clamp(s, 0.03, 0.97)), 0.7) * (0.35 + 0.65 * s);
    pts.push([cx + Math.cos(a) * sp.rx, cy + Math.sin(a) * sp.ry, w]);
  }
  brush(g, pts, { a: 0.85 * fa, dry: 0.8, bristle: 10, halo: 0.06, seed: sp.seed, cap: false });
}

/* ---------- 墨滴飞溅（按时间解析计算，可任意跳转） ---------- */
// b: {t0, x, y, ang, spread, v0, v1, n, grav, s0, s1, life, seed, a, drag}
function burst(g, b, t) {
  const age = t - b.t0;
  if (age < 0 || age > b.life * 1.05) return;
  const k = b.drag || 3.2;
  for (let i = 0; i < b.n; i++) {
    const r1 = rnd(b.seed, i), r2 = rnd(b.seed, i + 1000), r3 = rnd(b.seed, i + 2000), r4 = rnd(b.seed, i + 3000);
    const life = b.life * (0.45 + 0.55 * r3);
    if (age > life) continue;
    const an = b.ang + (r1 - 0.5) * b.spread, sp = lerp(b.v0, b.v1, r2 * r2), ex = Math.exp(-k * age);
    const dist = sp * (1 - ex) / k;
    const x = b.x + Math.cos(an) * dist, y = b.y + Math.sin(an) * dist + 0.5 * (b.grav || 0) * age * age;
    const vx = Math.cos(an) * sp * ex, vy = Math.sin(an) * sp * ex + (b.grav || 0) * age, v = Math.hypot(vx, vy);
    const size = lerp(b.s0, b.s1, r4 * r4) * (1 - 0.35 * age / life);
    const st = 1 + Math.min(v / 520, 2.6);
    dot(g, A.blots[i % A.blots.length], x, y, size, (b.a || 0.9) * (1 - smooth(age / life)), Math.atan2(vy, vx), st);
  }
}
// 晕开的墨团：r0→r1 半径
function bloom(g, x, y, t, t0, dur, r0, r1, a, idx, e) {
  const u = inv(t0, t0 + dur, t);
  if (t < t0 || u >= 1 && a <= 0) return;
  const rr = lerp(r0, r1, (e || E.outC)(u));
  dot(g, A.blooms[(idx || 0) % A.blooms.length], x, y, rr * 2 / 0.62, a, (idx || 0) * 1.3);
}

function shake(c, t, list) {
  if (REDUCED) return c;
  let sx = 0, sy = 0;
  for (let i = 0; i < list.length; i++) {
    const d = t - list[i][0];
    if (d >= 0 && d < 0.7) { const e = list[i][1] * Math.exp(-d * 7); sx += e * Math.sin(d * 71); sy += e * Math.cos(d * 53); }
  }
  c.sx = (c.sx || 0) + sx; c.sy = (c.sy || 0) + sy;
  return c;
}
function sun(g, x, y, r, a) {
  if (a <= 0.003) return;
  const gr = g.createRadialGradient(x, y, r * 0.2, x, y, r * 1.1);
  gr.addColorStop(0, rgba(CINNABAR, a)); gr.addColorStop(0.85, rgba(CINNABAR, a * 0.9)); gr.addColorStop(1, rgba(CINNABAR, 0));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 1.1, 0, TAU); g.fill();
}
function inkCirclePath(cx, cy, R, seed) {
  const p = new Path2D(), n = 96;
  for (let i = 0; i <= n; i++) {
    const th = i / n * TAU, cs = Math.cos(th), sn = Math.sin(th);
    const rr = R * (1 + 0.14 * (Noise.n2(cs * 2 + 5, sn * 2 + seed) - 0.5) + 0.06 * (Noise.n2(cs * 7, sn * 7) - 0.5));
    if (i) p.lineTo(cx + cs * rr, cy + sn * rr); else p.moveTo(cx + cs * rr, cy + sn * rr);
  }
  p.closePath(); return p;
}

}
function halfPlane(p1, p2, side) {

  const a = [p1[0] - u[0] * 4000, p1[1] - u[1] * 4000], b = [p2[0] + u[0] * 4000, p2[1] + u[1] * 4000];
  const nx = -u[1] * side * 8000, ny = u[0] * side * 8000, p = new Path2D();
  p.moveTo(a[0], a[1]); p.lineTo(b[0], b[1]); p.lineTo(b[0] + nx, b[1] + ny); p.lineTo(a[0] + nx, a[1] + ny); p.closePath();

}

  /* ---- 声音时间线 ---- */
  function buildCues() {
    const C = [], add = (t, fn, ...args) => C.push({ t, fn, args }), bed = (t, dur, fn, ...args) => C.push({ t, dur, fn, args, bed: true });
    // 序

    ['B2', 'D3', 'E3', 'G3', 'A3'].forEach((n, i) => add(3.4 + i * 0.25, 'qin', n, 0.45));
    add(5.8, 'swoosh', 1.7, 0.1, true, -0.6); add(6.45, 'qin', 'E2', 0.9); add(6.47, 'qin', 'B2', 0.6);

    [[8.2, 'B4', 1.3], [9.55, 'A4', 0.5], [10.05, 'B4', 0.5], [10.6, 'D5', 1.5], [12.15, 'B4', 0.7], [12.9, 'A4', 0.55], [13.5, 'G4', 0.55],
      [14.1, 'E4', 2.2], [16.5, 'G4', 0.5], [17.05, 'A4', 0.45], [17.55, 'B4', 1.2]].forEach(([t, n, d]) => add(t, 'xiao', NOTE[n], d, 1));

    add(18.72, 'swoosh', 0.62, 0.3, true, -0.8); add(19.1, 'drum', 0.35, false);
    // 承：每拍 0.6 秒
    bed(19.4, 12.2, 'drone', 0.04, [NOTE.E2, NOTE.B2]);
    for (let n = 0; n <= 20; n++) if (![5, 6, 8, 10, 13].includes(n)) add(19.4 + n * 0.6, 'tick', n % 2 ? 0.08 : 0.14);
    [[19.4, 'E2'], [20.6, 'B2'], [21.8, 'E2'], [23.6, 'D3'], [26.0, 'E2'], [27.8, 'B2'], [28.4, 'E3'], [28.8, 'G3'], [29.2, 'A3'], [29.6, 'B3']].forEach(([t, n]) => add(t, 'qin', n, 0.6));
    add(28.6, 'harm', NOTE.E5, 0.8); add(29.9, 'harm', NOTE.B4, 0.6);
    add(21.8, 'drum', 0.4, false);
    add(22.3, 'swoosh', 0.16, 0.22, true, -0.3); add(22.4, 'drum', 0.7, false);
    add(22.9, 'swoosh', 0.16, 0.2, true, -0.3); add(23.0, 'drum', 0.7, false);

    add(25.25, 'swoosh', 0.2, 0.25, false, 0.2); add(25.4, 'drum', 0.9, true); add(25.4, 'impact', 0.5, false);
    add(26.45, 'swoosh', 0.7, 0.32, true, -0.7); add(27.2, 'impact', 0.8, true); add(27.2, 'drum', 0.8, true);
    add(30.5, 'swoosh', 0.9, 0.34, true, -0.8);
    add(31.4, 'impact', 1.0, true); add(31.42, 'splash', 0.35); add(31.5, 'riser', 0.85, 0.16);

    bed(32.6, 13.0, 'wind', 0.12);
    add(32.65, 'swoosh', 0.9, 0.12, false, 0.5); add(33.3, 'gong', 0.35);

  function fire(c, when, dur, mid) {
    const f = V[c.fn]; if (!f) return;

  }
  function start(filmT) {
    if (!ready) return;
    if (ac.state === 'suspended') ac.resume();
    stopSession();
    sess = newSession();
    const now = ac.currentTime;
    offset = now + 0.06 - filmT;
    ci = 0;
    while (ci < cues.length && cues[ci].t < filmT - 0.02) {
      const c = cues[ci];
      if (c.bed && c.t + c.dur > filmT + 0.6) fire(c, now + 0.06, c.t + c.dur - filmT, true);
      ci++;
    }
    update(filmT);
  }
  function update(filmT) {
    if (!sess) return;
    while (ci < cues.length && cues[ci].t <= filmT + 0.3) {
      const c = cues[ci++];
      fire(c, Math.max(ac.currentTime + 0.005, offset + c.t), c.dur, false);
    }
  }
  function setMuted(m) {
    muted = m;
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.9, ac.currentTime, 0.05);
  }
  return {
    init, start, update, stop: stopSession, setMuted,
    isMuted: () => muted, ok: () => ready,
    end() { ci = cues.length; },
  };
})();

  fill.style.transform = 'scaleX(' + f.toFixed(4) + ')';
  knob.style.left = (f * 100).toFixed(3) + '%';
  timeEl.textContent = fmt(P.t) + ' / ' + fmt(DURATION);
  timeline.setAttribute('aria-valuenow', String(Math.round(P.t)));
  timeline.setAttribute('aria-valuetext', chapterAt(P.t) + ' ' + fmt(P.t));
}
function syncButtons() {
  $('icPlay').hidden = P.playing; $('icPause').hidden = !P.playing;
  btnPlay.setAttribute('aria-label', P.playing ? '暂停' : '播放');
  const m = Sound.isMuted(); $('icVol').hidden = m; $('icMute').hidden = !m;
  btnMute.setAttribute('aria-label', m ? '取消静音' : '静音');
}
let hideTimer = 0;
function showControls(stay) {
  controls.classList.remove('is-hidden'); stage.classList.remove('is-idle');
  clearTimeout(hideTimer);
  if (!stay && P.playing) hideTimer = setTimeout(() => {
    if (P.playing && !timeline.classList.contains('is-drag')) { controls.classList.add('is-hidden'); stage.classList.add('is-idle'); }
  }, 2600);
}
const poke = () => { if (P.started) showControls(false); };

function play() {
  if (!P.ready) return;
  if (P.t >= DURATION - 0.05) P.t = 0;
  P.playing = true; P.startT = P.t; P.startPerf = performance.now() + 60;
  Sound.start(P.t);
  btnReplay.classList.remove('is-on');
  syncButtons(); poke();
}
function pause() {
  P.playing = false; Sound.stop(); savePos();
  syncButtons(); showControls(true);
}
function finish() {
  P.playing = false; P.t = DURATION; P.dirty = true;
  Sound.end(); clearPos();
  btnReplay.classList.add('is-on');
  syncButtons(); showControls(true);
}
function seek(t) {
  P.t = clamp(t, 0, DURATION); P.dirty = true;
  btnReplay.classList.toggle('is-on', P.t >= DURATION);
  if (P.playing) { P.startT = P.t; P.startPerf = performance.now() + 60; Sound.start(P.t); }
  uiTime();
}

let perfN = 0, perfSum = 0, lastNow = 0, lowered = 0;
function perfSample(now) {
  if (!P.playing) { lastNow = 0; return; }
  if (lastNow) { perfSum += now - lastNow; perfN++; }
  lastNow = now;
  if (perfN >= 90) {
    const avg = perfSum / perfN; perfN = 0; perfSum = 0;
    if (avg > 27 && lowered < 2 && RS > 0.55) { setRenderScale(Math.max(0.5, Math.round(RS * 0.8 * 100) / 100)); lowered++; P.dirty = true; }
  }
}
function frame(now) {
  if (P.playing) {
    const t = P.startT + Math.max(0, now - P.startPerf) / 1000;
    if (t >= DURATION) finish(); else P.t = t;
    Sound.update(P.t);
    P.dirty = true;
  }
  if (P.dirty && P.ready) {
    renderTo(ctx, P.t); P.dirty = false; uiTime(); perfSample(now);
    if (!window.__ready) window.__ready = true;
  }
  requestAnimationFrame(frame);
}

/* ---- 交互 ---- */
function begin(from) {
  if (P.started || !P.ready) return;
  P.started = true;
  Sound.init();
  cover.classList.add('is-gone'); controls.hidden = false;
  setTimeout(() => { cover.hidden = true; }, 950);
  seek(from || 0); play();
}
btnStart.addEventListener('click', () => begin(0));
btnResume.addEventListener('click', () => begin(savedPos));
btnPlay.addEventListener('click', () => { P.playing ? pause() : play(); });
btnMute.addEventListener('click', () => {
  Sound.setMuted(!Sound.isMuted()); syncButtons();
  try { localStorage.setItem('inkkf.muted', Sound.isMuted() ? '1' : '0'); } catch (e) { /* 存储不可用 */ }
});
btnReplay.addEventListener('click', () => { seek(0); play(); });
const canFull = !!(app.requestFullscreen || app.webkitRequestFullscreen);
if (!canFull) btnFull.hidden = true;
function toggleFull() {
  if (!canFull) return;
  const fe = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    if (fe) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const p = (app.requestFullscreen || app.webkitRequestFullscreen).call(app); if (p && p.catch) p.catch(() => {}); }
  } catch (e) { /* 此环境不支持全屏 */ }
}
btnFull.addEventListener('click', toggleFull);
cvs.addEventListener('click', () => {
  if (!P.started) return;
  if (COARSE && controls.classList.contains('is-hidden')) { showControls(false); return; }
  P.playing ? pause() : play();
});
cvs.addEventListener('dblclick', toggleFull);
stage.addEventListener('pointermove', poke);
stage.addEventListener('pointerdown', poke);

const tAtX = x => { const r = timeline.getBoundingClientRect(); return clamp((x - r.left) / r.width, 0, 1) * DURATION; };
function showTip(x) {
  const r = timeline.getBoundingClientRect(), t = tAtX(x);
  tip.style.left = clamp(x - r.left, 30, r.width - 30) + 'px';
  tip.textContent = chapterAt(t) + ' · ' + fmt(t);
}
let dragging = false, wasPlaying = false;
timeline.addEventListener('pointerdown', e => {
  dragging = true; wasPlaying = P.playing;
  try { timeline.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  timeline.classList.add('is-drag');
  if (P.playing) { P.playing = false; Sound.stop(); syncButtons(); }
  seek(tAtX(e.clientX)); showTip(e.clientX); showControls(true);
});
timeline.addEventListener('pointermove', e => { showTip(e.clientX); if (dragging) seek(tAtX(e.clientX)); });
const endDrag = () => {
  if (!dragging) return;
  dragging = false; timeline.classList.remove('is-drag');
  if (wasPlaying && P.t < DURATION) play(); else showControls(true);
};
timeline.addEventListener('pointerup', endDrag);
timeline.addEventListener('pointercancel', endDrag);
CHAPTERS.slice(1).forEach(([, s]) => {
  const d = document.createElement('div'); d.className = 'tick'; d.style.left = (s / DURATION * 100) + '%'; $('ticks').appendChild(d);
});

document.addEventListener('keydown', e => {
  if (!P.started) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  switch (e.key) {
    case ' ': case 'k': case 'K': e.preventDefault(); P.playing ? pause() : play(); break;
    case 'ArrowLeft': e.preventDefault(); seek(P.t - 5); poke(); break;
    case 'ArrowRight': e.preventDefault(); seek(P.t + 5); poke(); break;
    case 'Home': e.preventDefault(); seek(0); poke(); break;
    case 'm': case 'M': btnMute.click(); break;
    case 'f': case 'F': toggleFull(); break;
    default: break;
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && P.playing) pause(); });
setInterval(() => { if (P.playing) savePos(); }, 2000);

/* ---- 启动 ---- */
async function loadFonts() {
  if (!document.fonts || !document.fonts.load) return;
  const jobs = [
    ['64px "Ma Shan Zheng"', '一滴墨落纸成山河心若止水冬练三九夏练三伏风起竹啸剑鸣身为笔气为墨天地为纸功夫开卷研'],
    ['700 22px "Noto Serif SC"', '山静苦练竹林归一'],
    ['900 64px "Noto Serif SC"', '中華武藝起承转合'],
    ['400 34px "Noto Serif SC"', '以武修身·以墨传神水墨功夫宣传片约秒建议开启声音继续观看从'],
    ['italic 500 30px "Cormorant Garamond"', 'A drop of ink becomes mountains'],
    ['500 30px "Cormorant Garamond"', 'KUNG FU'],
  ].map(([f, s]) => document.fonts.load(f, s).catch(() => null));
  await Promise.race([Promise.all(jobs), new Promise(r => setTimeout(r, 4000))]);
}
function storyboard() {
  const times = [1.8, 4.6, 6.8, 11, 16.5, 19.1, 20.9, 22.45, 24.2, 25.5, 26.85, 27.35, 29.2, 31.1, 31.9, 33.2, 34.8, 36.16,
    37.95, 39.3, 41.8, 43.1, 43.4, 44.5, 45.9, 47.2, 49.8, 52.9, 55.2, 57.6, 63.9];
  const wrap = document.createElement('div'); wrap.className = 'sb';
  times.forEach(t => {
    renderTo(ctx, t);
    const f = document.createElement('figure'), c = document.createElement('canvas'), cap = document.createElement('figcaption');
    c.width = 480; c.height = 270; c.getContext('2d').drawImage(cvs, 0, 0, 480, 270);
    cap.textContent = fmt(t) + '  ' + t.toFixed(2) + 's  ' + chapterAt(t);
    f.append(c, cap); wrap.appendChild(f);
  });
  document.body.appendChild(wrap);
  P.dirty = true;
}
window.__seek = t => { seek(t); renderTo(ctx, P.t); };

async function boot() {
  layout();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#ece3cf'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  try { if (localStorage.getItem('inkkf.muted') === '1') Sound.setMuted(true); } catch (e) { /* 存储不可用 */ }
  syncButtons(); uiTime();
  requestAnimationFrame(frame);
  await loadFonts();
  await buildAssets(p => { btnStart.setAttribute('aria-label', '准备中 ' + Math.round(p * 100) + '%'); });
  P.ready = true; P.dirty = true;
  btnStart.disabled = false; btnStart.textContent = '开卷'; btnStart.setAttribute('aria-label', '开卷观看');
  if (savedPos > 3 && savedPos < DURATION - 3) { btnResume.hidden = false; btnResume.textContent = '从 ' + fmt(savedPos) + ' 继续'; }
  if (location.hash === '#storyboard') storyboard();
}
boot();
</script>
