<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>程序员的一天</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#181425;color:#ead4aa;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;background:#181425}
#ov{position:absolute;pointer-events:none;overflow:hidden}
.bb{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#181425;border:2px solid #181425;
  padding:.15em .45em;white-space:nowrap;font-size:var(--fs);line-height:1.25;box-shadow:2px 2px 0 #181425;font-weight:bold}
.bb::after{content:"";position:absolute;left:50%;bottom:-.45em;width:.35em;height:.35em;background:#fff;border:2px solid #181425;border-top:none;border-left:none;transform:translateX(-50%)}
.bb.think{border-style:dashed;color:#3a4466}
.bb.shout{background:#fee761}
.bb.shout::after{background:#fee761}
.bb.ai{background:#2ce8f5}
.bb.ai::after{background:#2ce8f5}
.card{position:absolute;left:2%;top:9%;background:#181425;color:#fee761;border:2px solid #ead4aa;padding:.2em .6em;
  font-size:var(--fs);white-space:nowrap;font-weight:bold;box-shadow:3px 3px 0 #0008}
.card small{color:#c0cbdc;font-weight:normal;margin-left:.5em}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#181425cc;border:2px solid #ead4aa;
  padding:4px 10px;font-size:13px;pointer-events:none;white-space:nowrap;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#262b44;border-top:2px solid #3a4466}
button{font:inherit;font-size:13px;color:#ead4aa;background:#3a4466;border:2px solid #181425;padding:3px 8px;cursor:pointer;
  box-shadow:inset -2px -2px 0 #262b44,inset 2px 2px 0 #5a6988;white-space:nowrap;min-height:28px}
button:active{box-shadow:inset 2px 2px 0 #262b44}
button.on{background:#feae34;color:#181425;box-shadow:inset -2px -2px 0 #be4a2f,inset 2px 2px 0 #fee761}
#speed{display:flex;gap:2px}
#tl{position:relative;flex:1;height:22px;background:#181425;border:2px solid #5a6988;cursor:pointer;touch-action:none;min-width:80px}
#tlfill{position:absolute;left:0;top:0;bottom:0;background:#124e89;pointer-events:none}
#tlmarks{position:absolute;inset:0;pointer-events:none}
#tlmarks i{position:absolute;top:0;bottom:0;width:2px;background:#5a6988}
#tlknob{position:absolute;top:-4px;width:8px;height:26px;margin-left:-4px;background:#fee761;border:2px solid #181425;pointer-events:none}
#time{font-family:Consolas,"Courier New",monospace;font-size:14px;min-width:3.2em;text-align:center;color:#fee761}
#chaps{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px 8px;background:#262b44;overflow-x:auto;scrollbar-width:thin}
#chaps button{font-size:12px;flex:none}
#chaps button b{color:#8b9bb4;font-weight:normal;margin-right:4px;font-family:Consolas,monospace}
#chaps button.on b{color:#733e39}
@media (max-width:560px){#chaps{flex-wrap:nowrap}#bar{gap:5px;padding:5px 6px}button{padding:2px 6px;font-size:12px}#time{font-size:12px}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" width="320" height="180"></canvas>
    <div id="ov"></div>
    <div id="hint">点击画面开启声音 ♪</div>
  </div>
  <div id="bar">
    <button id="play" title="空格">❚❚</button>
    <div id="speed"><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="3">3×</button></div>
    <div id="tl"><div id="tlfill"></div><div id="tlmarks"></div><div id="tlknob"></div></div>
    <span id="time">07:00</span>
    <button id="mute" title="M">♪ 关</button>
  </div>
  <div id="chaps"></div>
</div>
<script>
'use strict';
/* ================= 基础：画布 / 调色板 / 工具 ================= */
const W = 320, H = 180;
const cv = document.getElementById('c');
const g = cv.getContext('2d', { alpha: false });
g.imageSmoothingEnabled = false;

// 统一 32 色调色板（ENDESGA 32）——全片所有像素只来自这里
const P = {
  ink:'#181425', night:'#262b44', navy:'#3a4466', slate:'#5a6988', gray:'#8b9bb4', light:'#c0cbdc', white:'#ffffff',
  deep:'#124e89', blue:'#0099db', cyan:'#2ce8f5', teal:'#193c3e', dgreen:'#265c42', green:'#3e8948', lime:'#63c74d',
  yellow:'#fee761', gold:'#feae34', orange:'#f77622', rust:'#be4a2f', tan:'#d77643', sand:'#ead4aa', skin:'#e4a672',
  brown:'#b86f50', dbrown:'#733e39', wine:'#3e2731', dred:'#a22633', red:'#e43b44', hot:'#ff0044', purple:'#68386c',
  pink:'#b55088', salmon:'#f6757a', peach:'#e8b796', clay:'#c28569'
};

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, f) => a + (b - a) * f;
const ease = f => f * f * (3 - 2 * f);
const fr = (v) => v - Math.floor(v);
function hash(n) { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function px(x, y, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), 1, 1); }
// 1 像素的线（Bresenham）
function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  g.fillStyle = c;
  let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, e = dx + dy, n = 0;
  while (n++ < 400) { g.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function circ(cx, cy, r, c) { // 实心像素圆
  g.fillStyle = c;
  for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y + r * .8)); g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); }
}

// 有序抖动（4×4 Bayer）：用调色板颜色做"半透明"，保证不产生调色板外的颜色
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const patCache = new Map();
function ditherPat(c, lvl) {
  const k = c + lvl; let p = patCache.get(k);
  if (!p) {
    const o = document.createElement('canvas'); o.width = o.height = 4;
    const x = o.getContext('2d'); x.fillStyle = c;
    for (let i = 0; i < 16; i++) if (BAYER[i] < lvl) x.fillRect(i & 3, i >> 2, 1, 1);
    p = g.createPattern(o, 'repeat'); patCache.set(k, p);
  }
  return p;
}
// lvl: 0..16（16 = 实心）
function dith(x, y, w, h, c, lvl) {
  lvl = Math.round(clamp(lvl, 0, 16)); if (lvl <= 0) return;
  if (lvl >= 16) return R(x, y, w, h, c);
  g.fillStyle = ditherPat(c, lvl); g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

/* ================= 3×5 像素字体（每行一个八进制数：4=左 2=中 1=右） ================= */
const FONT = {
  '0':'75557','1':'26227','2':'71747','3':'71317','4':'55711','5':'74717','6':'74757','7':'71122','8':'75757','9':'75717',
  A:'25755',B:'65656',C:'34443',D:'65556',E:'74647',F:'74644',G:'34553',H:'55755',I:'72227',J:'11152',K:'55655',L:'44447',M:'57755',
  N:'65555',O:'25552',P:'65644',Q:'25563',R:'65655',S:'34216',T:'72222',U:'55557',V:'55552',W:'55775',X:'55255',Y:'55222',Z:'71247',
  a:'03553',b:'46556',c:'03443',d:'13553',e:'02743',f:'12722',g:'35316',h:'46555',i:'20222',j:'10152',k:'45665',l:'62227',m:'06755',
  n:'06555',o:'02552',p:'06564',q:'03531',r:'05644',s:'03616',t:'27221',u:'05553',v:'05552',w:'05577',x:'05225',y:'05531',z:'07247',
  ' ':'00000','.':'00002',',':'00024',':':'02020',';':'02024','=':'07070','+':'02720','-':'00700','*':'05250','/':'11244',
  '(':'24442',')':'42224','{':'32623','}':'62326','[':'64446',']':'32223','<':'12421','>':'42124','!':'22202','?':'71202',
  "'":'22000','"':'55000','_':'00007','&':'25253','|':'22222','#':'57575','%':'51245','$':'36236','~':'03600','`':'42000','^':'25000','\\':'44211'
};
const GLYPH = {};
for (const k in FONT) GLYPH[k] = FONT[k].split('').map(Number);
function text(s, x, y, c) {
  g.fillStyle = c; x = Math.round(x); y = Math.round(y);
  for (let i = 0; i < s.length; i++) {
    const gl = GLYPH[s[i]];
    if (gl) for (let r = 0; r < 5; r++) { const b = gl[r]; if (!b) continue;
      if (b & 4) g.fillRect(x, y + r, 1, 1); if (b & 2) g.fillRect(x + 1, y + r, 1, 1); if (b & 1) g.fillRect(x + 2, y + r, 1, 1); }
    x += 4;
  }
}
const textW = s => s.length * 4 - 1;
function textC(s, cx, y, c) { text(s, cx - textW(s) / 2, y, c); }

/* ================= 时间轴 ================= */
// 每章：时长（秒）、游戏内时钟起止（分钟）
const CH = [
  { id:'alarm',   name:'闹钟',     dur:12, c0:420,  c1:447 },
  { id:'commute', name:'通勤',     dur:10, c0:510,  c1:548 },
  { id:'arrive',  name:'到工位',   dur:14, c0:570,  c1:615 },
  { id:'flow',    name:'心流',     dur:12, c0:630,  c1:715 },
  { id:'lunch',   name:'午饭',     dur:8,  c0:720,  c1:765 },
  { id:'alert',   name:'线上告警', dur:12, c0:840,  c1:920 },
  { id:'ai',      name:'AI 搭档',  dur:16, c0:930,  c1:1010 },
  { id:'deploy',  name:'部署',     dur:10, c0:1020, c1:1058 },
  { id:'pm',      name:'小地方',   dur:12, c0:1140, c1:1350 },
  { id:'night',   name:'深夜',     dur:14, c0:1380, c1:1439 }
];
let TOTAL = 0;
for (const c of CH) { c.t0 = TOTAL; TOTAL += c.dur; }
function chapterIndex(t) { for (let i = CH.length - 1; i >= 0; i--) if (t >= CH[i].t0) return i; return 0; }
function clockAt(t) {
  const c = CH[chapterIndex(t)], lt = t - c.t0;
  if (c.clock) return c.clock(lt);
  return lerp(c.c0, c.c1, clamp(lt / c.dur, 0, 1));
}
const fmtClock = m => { m = Math.floor(m) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

// 状态栏数值：全部是时间的纯函数 → 拖动时间轴永远不会错乱
function keyInterp(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) {
    const a = keys[i - 1], b = keys[i]; return lerp(a[1], b[1], ease((t - a[0]) / (b[0] - a[0])));
  }
  return keys[keys.length - 1][1];
}
const stepCount = (arr, t) => { let n = 0; for (const x of arr) if (t >= x) n++; return n; };
const ENERGY = [[0,12],[9,22],[12,30],[20,34],[26,72],[36,82],[47,50],[51,72],[57,22],[60.5,92],[68,58],[80,40],[86,78],[95,48],[98,18],[106,10],[116,8],[117.5,96],[120,12]];
const COFFEE_T = [26, 40.5, 67, 73];
const COMMIT_T = [39.2, 41.6, 44, 46.3, 81.5, 86.2, 104];
const BUG_K = [[60.2,1],[62,3],[64,5],[79.4,1],[81.5,0],[104.5,1]];
function bugsAt(t) { let v = 0; for (const k of BUG_K) if (t >= k[0]) v = k[1]; return v; }

/* ================= 天气（每天随机，但对同一天是确定的） ================= */
let day = 0;
function rainAt(min) {
  let a, b;
  if (day === 0) { a = 835; b = 1065; }            // 第一天：午后必下一场雨
  else { const h = hash(day * 7.3); if (h < .35) return 0; a = 450 + hash(day * 3.1) * 700; b = a + 90 + hash(day * 9.7) * 260; }
  if (min < a || min > b) return 0;
  return clamp(Math.min(min - a, b - min) / 25, 0, 1); // 渐入渐出
}

/* ================= 角色 ================= */
// 主角与同事共用同一套骨架。x = 身体中心列，y = 脚底线（最下一行像素在 y-1）
const SIT = new Set(['sit', 'type', 'drink', 'sleepy', 'eat', 'facepalmSit', 'scratchSit', 'think', 'boot']);
const HERO = { hair: P.ink, top: P.deep, topD: P.night, pants: P.navy, style: 'messy', glasses: true };
function guy(x, y, o) {
  o = Object.assign({}, HERO, o);
  const d = o.dir || 1, t = o.t || 0, pose = o.pose || 'stand';
  const skin = o.skin || P.skin, hair = o.hair, top = o.top, topD = o.topD || P.night, pants = o.pants;
  const sit = SIT.has(pose);
  let bob = 0; const f4 = Math.floor(t * 8) % 4;
  if (pose === 'walk') bob = (f4 & 1) ? -1 : 0;
  if (pose === 'cheer') bob = -Math.round(Math.abs(Math.sin(t * 9)) * 3);
  const Y = y + bob;
  const r = (dx, dy, w, h, c) => R(d > 0 ? x + dx : x - dx - w + 1, Y + dy, w, h, c);
  const T = -15;                         // 躯干顶
  let hx = 0, hy = 0;                    // 头部偏移（低头 / 打瞌睡）
  if (pose === 'sleepy') { hx = 1; hy = 2 + Math.round(Math.sin(t * 2) * .6); }
  if (pose === 'facepalm' || pose === 'facepalmSit') hy = 1;
  if (pose === 'boot') hx = 1;
  const HT = T - 6 + hy;

  // --- 腿 ---
  if (o.bag) r(-6, T + 1, 3, 7, o.bag);  // 背包
  if (sit) {
    r(-3, -8, 8, 2, pants); r(3, -6, 2, 5, pants); r(3, -1, 3, 1, P.ink);
  } else if (pose === 'walk') {
    const swap = f4 === 2, back = swap ? pants : P.night, front = swap ? P.night : pants;
    if (f4 % 2 === 0) {
      r(-2, -7, 2, 3, back); r(-3, -4, 2, 3, back); r(-4, -1, 3, 1, P.ink);
      r(0, -7, 2, 3, front); r(1, -4, 2, 3, front); r(1, -1, 3, 1, P.ink);
    } else { r(-2, -7, 2, 6, P.night); r(-1, -7, 2, 6, pants); r(-1, -1, 3, 1, P.ink); }
  } else {
    r(-2, -7, 2, 6, P.night); r(0, -7, 2, 6, pants); r(-2, -1, 2, 1, P.ink); r(0, -1, 3, 1, P.ink);
  }
  // --- 躯干 ---
  r(-3, T, 7, 8, top); r(-3, T, 1, 8, topD); r(-2, T, 3, 1, topD); // 连帽衫的帽子褶
  if (o.tie) r(1, T + 1, 1, 4, o.tie);
  if (o.badge) px(d > 0 ? x + 2 : x - 2, Y + T + 3, P.white);
  // --- 头 ---
  r(-2 + hx, HT, 6, 6, skin);
  const st = o.style;
  if (st === 'messy') { r(-3 + hx, HT - 1, 6, 2, hair); r(-3 + hx, HT + 1, 2, 3, hair); r(-2 + hx, HT - 2, 1, 1, hair); r(1 + hx, HT - 2, 1, 1, hair); r(3 + hx, HT - 1, 1, 1, hair); }
  else if (st === 'long') { r(-3 + hx, HT - 1, 6, 2, hair); r(-3 + hx, HT + 1, 2, 7, hair); }
  else if (st === 'bun') { r(-3 + hx, HT - 1, 6, 2, hair); r(-3 + hx, HT + 1, 2, 3, hair); r(-5 + hx, HT - 2, 3, 3, hair); }
  else if (st === 'bald') { r(-3 + hx, HT + 2, 2, 2, hair); px(d > 0 ? x + hx : x - hx, Y + HT, P.peach); }
  else if (st === 'cap') { r(-3 + hx, HT - 1, 6, 2, o.cap || P.red); r(3 + hx, HT, 3, 1, o.cap || P.red); r(-3 + hx, HT + 1, 2, 2, hair); }
  else { r(-3 + hx, HT - 1, 6, 2, hair); r(-3 + hx, HT + 1, 2, 2, hair); }
  if (o.beard) r(0 + hx, HT + 4, 4, 2, hair);
  // 屏幕光映在脸上
  if (o.glow) dith(d > 0 ? x + 1 + hx : x - 3 - hx, Y + HT, 3, 6, o.glow, o.glowLvl || 7);
  // 眼睛
  let eye = o.eyes || 'open';
  if (eye === 'open' && fr(t * .31 + (o.seed || 0)) < .05) eye = 'closed';   // 眨眼
  if (['sleepy', 'stretch'].includes(pose)) eye = 'closed';
  const ex = 2 + hx, ey = HT + 2;
  if (o.glasses) { r(ex - 1, ey - 1, 3, 3, o.glow || P.light); r(ex - 1, ey - 1, 3, 1, P.ink); }
  if (eye === 'closed') r(ex - 1, ey + (o.glasses ? 1 : 0), 2, 1, P.dbrown);
  else if (eye === 'wide') { r(ex, ey - 1, 1, 2, P.ink); }
  else { r(ex, ey, 1, 1, P.ink); if (eye === 'tired') r(ex - 1, ey + 2, 2, 1, P.clay); }
  // 嘴
  const talking = o.talk && (Math.floor(t * 7) % 2 === 0);
  if (pose === 'stretch' || o.mouth === 'o' || pose === 'cheer') r(2 + hx, HT + 4, 2, 2, P.wine);
  else if (talking) r(2 + hx, HT + 4, 2, 1, P.wine);
  else if (o.mouth === 'smile') { r(2 + hx, HT + 4, 2, 1, P.dbrown); px(d > 0 ? x + 4 + hx : x - 4 - hx, Y + HT + 3, P.dbrown); }
  else r(3 + hx, HT + 4, 1, 1, P.clay);
  if (o.phones) { r(-2 + hx, HT - 2, 5, 1, P.ink); r(-1 + hx, HT + 1, 2, 3, P.red); }
  if (o.sweat) { r(5 + hx, HT, 1, 2, P.cyan); px(d > 0 ? x + 5 + hx : x - 5 - hx, Y + HT - 1, P.white); }

  // --- 手臂（在头之后画，才能挡住脸） ---
  const k = Math.floor(t * 10) % 2;
  switch (pose) {
    case 'type': case 'boot':
      r(0, T + 1, 2, 3, top); r(1, T + 4, 5, 2, top);
      r(6, T + 4 + k, 2, 1, skin); r(5, T + 5 - k, 1, 1, P.clay); break;
    case 'drink':
      r(0, T + 1, 2, 3, top); r(2, T - 1, 2, 5, top); r(3, T - 2, 2, 2, skin);
      r(4, T - 5, 3, 4, o.mug || P.white); px(d > 0 ? x + 7 : x - 7, Y + T - 4, o.mug || P.white); break;
    case 'hold':
      r(0, T - 6, 2, 7, top); r(0, T - 8, 2, 2, skin); break;
    case 'phone':
      r(0, T + 1, 2, 3, top); r(1, T + 3, 3, 2, top); r(4, T, 2, 4, P.ink); r(4, T + 1, 1, 2, P.cyan); break;
    case 'stretch': case 'cheer':
      r(-3, T - 7, 2, 8, top); r(2, T - 7, 2, 8, top); r(-3, T - 8, 2, 1, skin); r(2, T - 8, 2, 1, skin); break;
    case 'scratch': case 'scratchSit':
      r(1, T - 3, 2, 4, top); r(-1 + k, HT - 2, 3, 2, skin);
      px(d > 0 ? x - 3 : x + 3, Y + HT - 3 - k, P.gray); px(d > 0 ? x + 4 : x - 4, Y + HT - 4 + k, P.gray); break;
    case 'facepalm': case 'facepalmSit':
      r(1, T - 1, 2, 3, top); r(1, HT + 1, 4, 3, skin); break;
    case 'point':
      r(0, T + 1, 2, 2, top); r(1, T + 2, 6, 2, top); r(7, T + 2, 2, 1, skin); break;
    case 'eat': {
      const up = Math.floor(t * 1.6) % 2;
      r(0, T + 1, 2, 3, top);
      if (up) { r(2, T - 1, 2, 5, top); r(3, T - 2, 2, 2, skin); r(5, T - 4, 1, 3, P.sand); r(4, T - 3, 1, 1, P.sand); }
      else { r(1, T + 4, 4, 2, top); r(5, T + 4, 2, 1, skin); r(7, T + 2, 1, 3, P.sand); }
      break; }
    case 'sleepy':
      r(0, T + 1, 2, 3, top); r(1, T + 4, 5, 2, top); r(6, T + 5, 2, 1, skin); break;
    case 'think':
      r(0, T + 1, 2, 3, top); r(2, T - 1, 2, 5, top); r(3, HT + 5, 2, 2, skin); break;
    case 'wave':

    ci:       { bpm: 120, root: 60, sc: [0, 2, 4, 5, 7, 9, 11], mel: [0, -1, 0, -1, 2, -1, 2, -1, 4, -1, 4, -1, 5, 5, 6, 6], bass: [0, 0, 4, 4], drum: 1, lead: 'square' },

    pm:       { bpm: 90,  root: 58, sc: [0, 2, 3, 5, 7, 8, 10], mel: [4, -1, 3, -1, 2, -1, 1, -1, 0, -1, -1, -1, -1, -1, -1, -1], bass: [0, 0, 5, 5], drum: 0, lead: 'triangle' },
    overtime: { bpm: 176, root: 58, sc: [0, 2, 3, 5, 7, 8, 10], mel: [0, 2, 3, 2, 0, 2, 3, 5, 3, 2, 0, 2, 3, 2, 0, -1], bass: [0, 0, 5, 4], drum: 2, lead: 'square' },
    night:    { bpm: 70,  root: 57, sc: [0, 2, 4, 7, 9], mel: [4, -1, 2, -1, 0, -1, 2, -1, 1, -1, -1, -1, 0, -1, -1, -1], bass: [0, 5, 3, 4], drum: 0, lead: 'triangle' },
    idea:     { bpm: 100, root: 60, sc: [0, 2, 4, 7, 9], mel: [0, 2, 4, 7, 9, 7, 9, 12, -1, -1, -1, -1, -1, -1, -1, -1], bass: [0, 0, 0, 0], drum: 0, lead: 'triangle' }
  },
  note(m, deg) { const sc = m.sc, o = Math.floor(deg / sc.length), i = ((deg % sc.length) + sc.length) % sc.length; return 440 * Math.pow(2, (m.root + sc[i] + 12 * o - 69) / 12); },
  // 每帧调用：rate = 播放倍速（暂停时为 0）
  tick(mood, rate, typing) {
    if (!this.ctx || this.muted || this.ctx.state !== 'running') return;
    const c = this.ctx, now = c.currentTime;
    if (mood !== this.mood) { this.mood = mood; this.step = 0; this.nextBeat = Math.max(this.nextBeat, now + .05); }
    if (!rate) { this.nextBeat = now + .05; return; }
    if (this.nextBeat < now - .2) this.nextBeat = now + .05;
    const m = this.MOODS[mood] || this.MOODS.office;
    const spb = 60 / (m.bpm * (rate > 1 ? 1 + (rate - 1) * .25 : 1)) / 2;   // 八分音符
    while (this.nextBeat < now + .12) {
      const s = this.step, w = this.nextBeat;
      const deg = m.mel[s % 16];
      if (deg >= 0) this.tone(this.note(m, deg + 7), w, spb * .9, m.lead, .07);
      if (m.arp && s % 2) this.tone(this.note(m, m.bass[(s >> 2) % 4] + 14 + (s % 4)), w, spb * .5, 'square', .03);
      if (s % 4 === 0) this.tone(this.note(m, m.bass[(s >> 2) % 4]) / 2, w, spb * 3.5, 'triangle', .16);
      if (m.drum) {
        if (s % 4 === 0) this.tone(120, w, .12, 'sine', .3, this.music, .4);
        if (m.drum > 1 && s % 4 === 2) this.hiss(w, .08, .1, 1500, this.music);
        if (s % 2 === 1) this.hiss(w, .03, .05, 7000, this.music);
      }
      if (typing && (s % 2 === 0 || hash(s) > .5)) this.hiss(w + spb * .1, .03, .12, 2500, this.sfx);  // 有节奏的键盘声
      this.step++; this.nextBeat += spb;
    }
  }
};

/* ================= 主循环 / 状态栏 / 转场 / 交互 ================= */
CH[2].cuts = [8.6]; CH[6].cuts = [12]; CH[7].cuts = [6.9]; CH[8].cuts = [5.5]; CH[9].cuts = [5];
let t = 0, playing = true, speed = 1, last = performance.now(), dragging = false;
const $ = id => document.getElementById(id);
const stage = $('stage'), ov = $('ov'), tl = $('tl');

function typingAt(t) {
  const i = chapterIndex(t), lt = t - CH[i].t0;
  return i === 3 || (i === 5 && lt > 3.8) || (i === 6 && (lt < 2.2 || lt > 13.5)) || (i === 8 && lt > 5.5 && lt < 9.6);
}
function fireEvents(a, b) {   // 触发 [a,b) 之间的音效
  if (b <= a) return;
  for (const c of CH) for (const [lt, n] of c.sfx) { const e = c.t0 + lt; if (e >= a && e < b) AU.play(n); }
  for (const e of COMMIT_T) if (e >= a && e < b) AU.play('commit');
}

/* ---------- 状态栏 ---------- */
function statusBar() {
  const min = clockAt(t);
  R(0, 0, W, 10, P.ink); R(0, 10, W, 1, P.navy);
  if (min >= 400 && min < 1140) { circ(5, 5, 2, P.gold); } else { circ(5, 5, 2, P.sand); R(6, 3, 2, 3, P.ink); }
  text(fmtClock(min), 11, 3, P.white);
  // 精力
  const en = keyInterp(ENERGY, t);
  px(36, 2, P.yellow); R(35, 3, 2, 2, P.yellow); R(34, 5, 3, 1, P.yellow); R(35, 6, 2, 1, P.yellow); px(35, 7, P.yellow);
  R(40, 3, 32, 5, P.navy); R(41, 4, 30, 3, P.ink);
  const ec = en > 60 ? P.lime : en > 30 ? P.gold : P.red;
  if (!(en < 20 && Math.floor(RT * 3) % 2)) R(41, 4, Math.round(30 * en / 100), 3, ec);
  // 咖啡
  const cups = stepCount(COFFEE_T, t) + FX.extra;
  R(80, 3, 4, 5, P.white); px(84, 4, P.white); px(84, 5, P.white); R(81, 4, 2, 1, P.dbrown);
  text('x' + cups, 87, 3, P.sand);
  // 提交
  const cm = stepCount(COMMIT_T, t);
  R(106, 5, 7, 1, P.green); circ(109, 5, 1, P.lime);
  text(String(cm), 116, 3, P.lime);
  // bug
  const bg = bugsAt(t), blink = bg > 0 && Math.floor(RT * 2) % 2;
  R(134, 3, 4, 5, blink ? P.hot : P.red); px(133, 4, P.ink); px(138, 4, P.ink); px(133, 6, P.ink); px(138, 6, P.ink);
  px(132, 4, P.gray); px(139, 4, P.gray); px(132, 6, P.gray); px(139, 6, P.gray); px(135, 2, P.gray); px(136, 2, P.gray);
  text(String(bg), 142, 3, bg ? P.salmon : P.gray);
  // 右侧：天气 + 第几天
  if (rainAt(min) > 0) { for (let i = 0; i < 3; i++) R(262 + i * 4, 3 + (i % 2), 1, 3, P.cyan); }
  const d = 'DAY ' + (day + 1); text(d, W - textW(d) - 3, 3, P.gray);
}

/* ---------- 画面 ---------- */
function render() {
  const i = chapterIndex(t), c = CH[i], lt = t - c.t0;
  g.setTransform(1, 0, 0, 1, 0, 0);
  c.draw(lt, t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  // 章节转场：像素抖动淡入淡出；章内切镜头更短
  const d = Math.min(lt, c.dur - lt);
  if (d < .5) dith(0, 10, W, H - 10, P.ink, (1 - d / .5) * 16);
  for (const k of c.cuts || []) { const e = Math.abs(lt - k); if (e < .25) dith(0, 10, W, H - 10, P.ink, (1 - e / .25) * 16); }
  if (!playing) { R(W - 12, 14, 3, 9, P.white); R(W - 7, 14, 3, 9, P.white); }
  statusBar();
}

/* ---------- 台词气泡（DOM 覆盖层，文字清晰且不受最小字号影响） ---------- */
let lastKey = '';
function updateBubbles() {
  const i = chapterIndex(t), c = CH[i], lt = t - c.t0;
  const list = c.bub(lt).filter(Boolean);
  if (FX.pop && RT < FX.pop.until) list.push(FX.pop);
  const card = lt < 2.6 ? fmtClock(clockAt(c.t0 + .01)) + '|' + c.name : '';
  const key = card + '#' + list.map(b => b.s + b.x + b.y + b.cls).join('|');
  if (key === lastKey) return;
  lastKey = key;
  let h = card ? `<div class="card">${card.split('|')[0]}<small>${String(i + 1).padStart(2, '0')} · ${card.split('|')[1]}</small></div>` : '';
  for (const b of list) h += `<div class="bb ${b.cls || ''}" style="left:${b.x / W * 100}%;top:${b.y / H * 100}%">${b.s}</div>`;
  ov.innerHTML = h;
  // 贴边的气泡往里收，保证文字不溢出画面
  const ow = ov.clientWidth;
  for (const el of ov.querySelectorAll('.bb')) {
    const bw = el.offsetWidth, cx = parseFloat(el.style.left) / 100 * ow;
    const nx = clamp(cx, bw / 2 + 3, ow - bw / 2 - 3);
    if (nx !== cx) el.style.left = nx + 'px';
  }
}

/* ---------- 尺寸：整数倍放大 ---------- */
function resize() {
  const sw = stage.clientWidth, sh = stage.clientHeight, dpr = window.devicePixelRatio || 1;
  const k = Math.floor(Math.min(sw * dpr / W, sh * dpr / H));
  let cw = k >= 1 ? k * W / dpr : Math.min(sw, sh * W / H);
  const ch = cw * H / W;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  Object.assign(ov.style, { left: (sw - cw) / 2 + 'px', top: (sh - ch) / 2 + 'px', width: cw + 'px', height: ch + 'px' });
  ov.style.setProperty('--fs', Math.max(11, Math.round(cw / 44)) + 'px');
  lastKey = '';
}
window.addEventListener('resize', resize);

/* ---------- 控件 ---------- */
const chapsEl = $('chaps'), marks = $('tlmarks');
CH.forEach((c, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<b>${fmtClock(c.c0)}</b>${c.name}`;
  b.onclick = () => { t = c.t0 + .5; lastKey = ""; };
  chapsEl.appendChild(b); c.btn = b;
  if (i) { const m = document.createElement('i'); m.style.left = c.t0 / TOTAL * 100 + '%'; marks.appendChild(m); }
});
function setPlaying(p) { playing = p; $('play').textContent = p ? '❚❚' : '▶'; }
function setSpeed(s) { speed = s; for (const b of $('speed').children) b.classList.toggle('on', +b.dataset.s === s); }
function enableSound() { AU.init(); if (AU.ctx) { AU.setMuted(false); $('mute').textContent = '♪ 开'; $('mute').classList.add('on'); } $('hint').style.display = 'none'; }
function toggleMute() { if (!AU.ctx || AU.muted) enableSound(); else { AU.setMuted(true); $('mute').textContent = '♪ 关'; $('mute').classList.remove('on'); } }
$('play').onclick = () => setPlaying(!playing);
for (const b of $('speed').children) b.onclick = () => setSpeed(+b.dataset.s);
$('mute').onclick = toggleMute;
function seekFrom(e) { const r = tl.getBoundingClientRect(); t = clamp((e.clientX - r.left) / r.width, 0, .99999) * TOTAL; lastKey = ''; }
tl.addEventListener('pointerdown', e => { dragging = true; tl.setPointerCapture(e.pointerId); seekFrom(e); });
tl.addEventListener('pointermove', e => { if (dragging) seekFrom(e); });
const endDrag = () => { dragging = false; };
tl.addEventListener('pointerup', endDrag); tl.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key >= '1' && e.key <= '3') setSpeed(+e.key);
  else if (e.key === 'm' || e.key === 'M') toggleMute();
  else if (e.key === 'ArrowRight') { t = Math.min(TOTAL - .001, t + 5); lastKey = ''; }
  else if (e.key === 'ArrowLeft') { t = Math.max(0, t - 5); lastKey = ''; }
});
// 点击画面：第一次开启声音；点中彩蛋触发互动
cv.addEventListener('pointerdown', e => {
  if (!AU.started) { AU.started = true; enableSound(); }
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  const c = CH[chapterIndex(t)], lt = t - c.t0;
  const hit = c.hits(lt).find(h => x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h);
  if (!hit) return;
  const pop = s => { FX.pop = { x: hit.x + hit.w / 2, y: hit.y - 2, s, cls: '', until: RT + 1.3 }; lastKey = ''; };
  if (hit.id === 'cat') { FX.meow = RT; AU.play('meow'); pop(['喵～', '喵？', '喵喵！'][Math.floor(Math.random() * 3)]); }
  else if (hit.id === 'clock') { FX.snooze = RT; AU.play('snooze'); pop('再贪睡一次？'); }
  else if (hit.id === 'coffee' || hit.id === 'mug') { FX.refill = RT; FX.extra++; AU.play('coffee'); pop('续杯 +1'); }
  else if (hit.id === 'bot') { FX.bot = RT; AU.play('bot'); }
});

/* ---------- 主循环：时间推进与帧率无关 ---------- */
let lastChap = -1, lastTxt = '';
function frame(now) {
  const dt = Math.min(.1, Math.max(0, (now - last) / 1000)); last = now; RT += dt;
  if (playing && !dragging) {
    const nt = t + dt * speed;
    if (nt >= TOTAL) { fireEvents(t, TOTAL); t = nt - TOTAL; day++; fireEvents(0, t); lastKey = ''; }
    else { fireEvents(t, nt); t = nt; }
  }
  render();
  updateBubbles();
  const i = chapterIndex(t), c = CH[i];
  AU.tick(c.moodAt ? c.moodAt(t - c.t0) : c.mood, playing && !dragging ? speed : 0, typingAt(t) && playing && !dragging);
  const f = t / TOTAL * 100 + '%';
  $('tlfill').style.width = f; $('tlknob').style.left = f;
  const txt = fmtClock(clockAt(t)); if (txt !== lastTxt) { $('time').textContent = txt; lastTxt = txt; }
  if (i !== lastChap) {
    if (lastChap >= 0) CH[lastChap].btn.classList.remove('on');
    c.btn.classList.add('on'); lastChap = i;
    chapsEl.scrollTo({ left: c.btn.offsetLeft - chapsEl.clientWidth / 2 + c.btn.offsetWidth / 2, behavior: 'smooth' });
  }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
