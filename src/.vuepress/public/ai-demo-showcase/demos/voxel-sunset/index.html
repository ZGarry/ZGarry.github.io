<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>永恒落日 · Voxel Sunset</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;user-select:none}
  [hidden]{display:none!important}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #crosshair{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;opacity:.85;z-index:5}
  #crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
  #crosshair:before{left:8px;top:0;width:2px;height:18px}
  #crosshair:after{top:8px;left:0;width:18px;height:2px}
  #hotbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:rgba(10,8,14,.45);border:1px solid rgba(255,200,160,.25);border-radius:8px;backdrop-filter:blur(4px);z-index:5}
  .slot{width:46px;height:46px;border:2px solid rgba(255,255,255,.18);border-radius:5px;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(0,0,0,.25)}
  .slot.sel{border-color:#ffcf8a;box-shadow:0 0 12px rgba(255,170,80,.6)}
  .slot.empty canvas{opacity:.3}
  .slot canvas{width:34px;height:34px;image-rendering:pixelated}
  .slot span{position:absolute;left:4px;top:2px;font-size:10px;color:rgba(255,255,255,.55)}
  .slot em{position:absolute;right:4px;bottom:2px;font-size:11px;font-style:normal;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
  #hearts{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:5;color:#ff4d4d;font-size:18px;letter-spacing:2px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  #hearts i{font-style:normal}
  #stats{position:fixed;left:14px;bottom:14px;color:rgba(255,230,200,.85);font-size:12px;letter-spacing:.12em;text-shadow:0 1px 3px rgba(0,0,0,.7);z-index:5}
  #mode{position:fixed;right:14px;bottom:14px;color:rgba(255,230,200,.9);font-size:13px;letter-spacing:.3em;text-shadow:0 1px 3px rgba(0,0,0,.7);z-index:5}
  #quests{position:fixed;right:14px;top:14px;z-index:5;background:rgba(10,8,14,.4);border:1px solid rgba(255,200,160,.2);border-radius:8px;padding:10px 14px;min-width:190px;backdrop-filter:blur(4px)}
  #quests h3{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.3em;color:#ffcf8a}
  #quests .q{font-size:12px;color:rgba(255,235,220,.85);margin:3px 0}
  #quests .q.done{color:rgba(160,220,140,.8)}
  #quests .q.gold{color:#ffd87a}
  #toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(10px);background:rgba(12,8,16,.7);border:1px solid rgba(255,200,160,.35);color:#ffe6c4;padding:8px 22px;border-radius:20px;font-size:14px;letter-spacing:.1em;opacity:0;transition:all .3s;z-index:7;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.gold{color:#ffd87a;border-color:#ffd87a;box-shadow:0 0 20px rgba(255,190,90,.4)}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,30,20,.45));opacity:0}
  #flash.show{animation:flashA .5s ease-out}
  @keyframes flashA{0%{opacity:1}100%{opacity:0}}
  /* 背包 */
  #invPanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);width:min(640px,92vw);max-height:80vh;overflow:auto;background:rgba(14,10,20,.92);border:1px solid rgba(255,200,160,.35);border-radius:12px;padding:18px 22px;z-index:9;opacity:0;pointer-events:none;transition:all .18s;color:#ffe6c4}
  #invPanel.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  #invPanel h3{margin:4px 0 10px;font-size:13px;letter-spacing:.3em;color:#ffcf8a;font-weight:600}
  #invGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
  #invGrid .cell{border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;background:rgba(0,0,0,.25)}
  #invGrid .cell:hover{border-color:#ffcf8a}
  #invGrid .cell canvas{width:32px;height:32px;image-rendering:pixelated}
  #invGrid .cell em{font-style:normal;font-size:11px;font-weight:700}
  #invGrid .cell b{font-size:11px;font-weight:400;color:rgba(255,235,220,.8)}
  #invGrid .hint{grid-column:1/-1;text-align:center;color:rgba(255,235,220,.5);font-size:13px;padding:14px}
  #craftList .recipe{display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:7px 12px;margin:6px 0;cursor:pointer;background:rgba(0,0,0,.25)}
  #craftList .recipe:hover{border-color:#ffcf8a}
  #craftList .recipe.off{opacity:.35;cursor:default}
  #craftList .recipe canvas{width:26px;height:26px;image-rendering:pixelated}
  #craftList .recipe b{font-size:13px}
  #craftList .recipe span{font-size:11px;color:rgba(255,235,220,.6);margin-left:auto}
  #invTip{font-size:11px;color:rgba(255,235,220,.45);margin-top:10px}
  /* 死亡 */
  #death{position:fixed;inset:0;background:rgba(60,8,8,.55);backdrop-filter:blur(2px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:11;opacity:0;pointer-events:none;transition:opacity .6s;cursor:pointer}
  #death.show{opacity:1;pointer-events:auto}
  #death h1{margin:0;color:#ffd0c0;font-weight:300;font-size:46px;letter-spacing:.4em;text-indent:.4em}
  #death p{color:rgba(255,220,210,.75);font-size:14px;letter-spacing:.2em}
  /* 通关 */
  #victory{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;z-index:11;opacity:0;pointer-events:none;transition:opacity 1s}
  #victory.show{opacity:1}
  #victory h1{margin:0;font-size:44px;font-weight:300;letter-spacing:.4em;text-indent:.4em;color:#ffd87a;text-shadow:0 0 40px rgba(255,180,60,.8)}
  #victory p{color:rgba(255,225,180,.85);letter-spacing:.3em;font-size:14px}
  /* 主菜单 */
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(120% 90% at 50% 72%,rgba(46,16,42,.86),rgba(8,6,16,.96));z-index:10;cursor:pointer;transition:opacity .6s}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay h1{margin:0;font-size:54px;font-weight:300;letter-spacing:.45em;text-indent:.45em;color:#ffd9a0;text-shadow:0 0 34px rgba(255,140,60,.55)}
  #overlay h2{margin:0 0 8px;font-size:13px;font-weight:400;letter-spacing:.6em;text-indent:.6em;color:rgba(255,180,200,.75)}
  #overlay .keys{display:grid;grid-template-columns:auto auto;gap:6px 26px;color:rgba(255,235,220,.78);font-size:13px}
  #overlay .keys b{color:#ffcf8a;font-weight:600;text-align:right}
  #overlay .enter{margin-top:14px;padding:10px 38px;border:1px solid rgba(255,200,140,.5);border-radius:30px;color:#ffe6c4;font-size:14px;letter-spacing:.3em;text-indent:.3em;transition:box-shadow .3s}
  #overlay .enter.ready{box-shadow:0 0 24px rgba(255,160,80,.45)}
  #overlay .load{color:rgba(255,200,170,.6);font-size:12px;letter-spacing:.2em;min-height:16px}
  #overlay .newWorld{color:rgba(255,160,160,.55);font-size:12px;letter-spacing:.15em;text-decoration:underline}
  #overlay .newWorld:hover{color:#ff9a8a}
</style>
</head>
<body>
<div id="app"></div>
<div id="crosshair" hidden></div>
<div id="hearts" hidden></div>
<div id="hotbar" hidden></div>
<div id="stats" hidden></div>
<div id="mode" hidden></div>
<div id="quests" hidden></div>
<div id="toast"></div>
<div id="flash"></div>
<div id="invPanel">
  <h3>背包</h3>
  <div id="invGrid"></div>
  <h3 style="margin-top:16px">合成</h3>
  <div id="craftList"></div>
  <div id="invTip">点击物品放入当前选中的快捷栏格 · 按 E 关闭</div>
</div>
<div id="death"><h1>你死了</h1><p>点击重生</p></div>
<div id="victory"><h1>永恒黄昏被点亮</h1><p>全部目标完成 · 通关</p></div>
<div id="overlay">
  <h1>永恒落日</h1>
  <h2>ETERNAL SUNSET · VOXEL GLIDE</h2>
  <div class="keys">
    <b>鼠标</b><span>视角 · 长按左键挖掘 · 右键放置</span>
    <b>W A S D</b><span>移动 · 滑翔时 W/S 加减速</span>
    <b>空格</b><span>跳跃 / 水中上浮</span>
    <b>F</b><span>起飞,重新滑翔</span>
    <b>E</b><span>背包与合成</span>
    <b>C</b><span>创造 / 生存切换</span>
    <b>Shift · 1-9 · 滚轮</b><span>疾跑 · 快捷栏</span>
  </div>
  <div class="enter" id="enterBtn">正在生成世界…</div>
  <div class="load" id="loadInfo"></div>
  <div class="newWorld" id="newWorld" hidden>清除存档,开始新世界</div>
</div>
